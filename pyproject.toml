[[tool.uv.dependency-metadata]]
name = "torch"
version = "2.13.0+cu130"
requires-dist = [
    "filelock",
    "typing-extensions>=4.10.0",
    "setuptools>=77.0.3",
    "sympy>=1.13.3",
    "networkx>=2.5.1",
    "jinja2",
    "fsspec>=0.8.5",
    "cuda-toolkit[cublas,cudart,cufft,cufile,cupti,curand,cusolver,cusparse,nvjitlink,nvrtc,nvtx]==13.0.3; platform_system == \"Linux\"",
    "cuda-bindings<14,>=13.0.3; platform_system == \"Linux\" and python_version < \"3.15\"",
    "nvidia-cudnn-cu13==9.20.0.48; platform_system == \"Linux\"",
    "nvidia-cusparselt-cu13==0.8.1; (platform_system == \"Linux\") and platform_machine == \"x86_64\"",
    "nvidia-cusparselt-cu13==0.9.1; (platform_system == \"Linux\") and platform_machine == \"aarch64\"",
    "nvidia-nccl-cu13==2.29.7; platform_system == \"Linux\"",
    "nvidia-nvshmem-cu13==3.4.5; platform_system == \"Linux\"",
    "triton==3.7.1; platform_system == \"Linux\" and python_version < \"3.15\"",
    "optree>=0.13.0; extra == \"optree\"",
    "opt-einsum>=3.3; extra == \"opt-einsum\"",
    "pyyaml; extra == \"pyyaml\""
]
provides-extra = ["optree", "opt-einsum", "pyyaml"]

[tool.uv.sources]
# No published Torch 2.13 ABI wheel is available in the current wheelhouse.
# Use official pinned sources; match-runtime below separates the build cache
# for Torch 2.11 and 2.13. Replace with ABI-qualified wheels when published.
apex = { git = "https://github.com/NVIDIA/apex.git", rev = "8a6508aaad6e75a2b939e33f308cd63d745d97f1" }
# flash-attn uses the official PyPI sdist; setup tries its matching release wheel first.
megatron-bridge = { git = "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git", rev = "51885cf132b2814188b6855c25a8588254274c2a" }
flashinfer-cubin     = { index = "flashinfer" }
flashinfer-jit-cache = { index = "flashinfer-cu130" }

# Core 0.19 uses the official PyPI release wheel on both architectures.
# mbridge retains its existing pinned source.
# Preserve the existing CPU Core source; GPU Core uses its PyPI release.
megatron-core = { git = "https://github.com/NVIDIA/Megatron-LM.git", tag = "core_v0.18.0", extra = "cpu" }
mbridge            = { git = "https://github.com/ISEEKYAN/mbridge.git",            rev = "641a5a0" }

# Per-extra routing to the matching pytorch wheel index.
torch = [
    { index = "pytorch-cu130", extra = "vllm" },
    { index = "pytorch-cu130", extra = "sglang" },
    { index = "pytorch-cu130", extra = "fsdp" },
    { index = "pytorch-cu130", extra = "megatron" },
    { index = "pytorch-cpu",   extra = "cpu" },
    # trtllm (DEFERRED) would route to CUDA 13 here:
    #   { index = "pytorch-cu130", extra = "trtllm" },
]
torchvision = [
    { index = "pytorch-cu130", extra = "vllm" },
    { index = "pytorch-cu130", extra = "sglang" },
    { index = "pytorch-cu130", extra = "fsdp" },
    { index = "pytorch-cu130", extra = "megatron" },
    { index = "pytorch-cpu",   extra = "cpu" },
]
torchaudio = [
    { index = "pytorch-cu130", extra = "vllm" },
    { index = "pytorch-cu130", extra = "sglang" },
    { index = "pytorch-cu130", extra = "fsdp" },
    { index = "pytorch-cu130", extra = "megatron" },
    { index = "pytorch-cpu",   extra = "cpu" },
]

[tool.uv.extra-build-dependencies]
apex = [
    { requirement = "torch", match-runtime = true },
    "packaging", "ninja", "wheel", "setuptools<81",
]
flash-attn = [
    { requirement = "torch", match-runtime = true },
    "packaging", "ninja", "wheel", "setuptools<81",
]
transformer-engine-torch = [
    { requirement = "torch", match-runtime = true },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# verl wheelhouse: prebuilt cu130 / torch-2.11 / cp312 native wheels, published
# side by side for linux_x86_64 and linux_aarch64 (uv picks by platform tag).
# Only the packages routed above are pulled here (explicit = true); the rest stay
# on PyPI.
[[tool.uv.index]]
name = "verl-wheelhouse"
url = "https://verl-project.github.io/verl-wheelhouse/cu130/torch2.11/simple/"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[tool.uv.extra-build-variables]
apex = { APEX_CPP_EXT = "1", APEX_CUDA_EXT = "1" }

[[tool.uv.dependency-metadata]]
name = "apex"
version = "0.1"
requires-dist = ["packaging>20.6"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]
