  maxtext_path: ${actor_rollout_ref.actor.maxtext.maxtext_path}
  overrides: ${actor_rollout_ref.actor.maxtext.overrides}
  env: ${actor_rollout_ref.actor.maxtext.env}
  forward_only: true
