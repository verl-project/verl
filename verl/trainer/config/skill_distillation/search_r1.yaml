# Static, shared-snapshot self-teachers for the synchronous Search-R1 recipe.
enabled: true

bank_path: examples/search_r1/skills/static_v2.json

# O2PD Reset Support with the forward-KL endpoint, not its adaptive alpha loss.
objective: forward_kl_topk_tail
top_k: 32
min_topk_overlap: 0.5
# Optional O2PD-style prefix ablation. Count generated assistant tokens only.
# Default 1.0 preserves later-turn answer supervision until the overlap gate trips.
prefix_fraction: 1.0

# split: E=think+query, P=think, Q=query, A=think+decision+answer.
# combined: one teacher with all rules; all: all generated tokens (ablation).
mode: split

beta: 0.01

# Linear ramp, reaching beta at this training step; zero disables warmup.
warmup_steps: 10

weights:
  entity: 1.0
  planning: 1.0
  query: 1.0
  answer: 1.0
  combined: 1.0

# Separately normalized answer-teacher components; do not drown the decision
# token in the much longer think span. Other teachers retain token-mean loss.
answer_component_weights:
  think: 0.1
  decision: 1.0
  content: 1.0

# Teacher forwards run sequentially on the unchanged actor before any update.
teacher_micro_batch_size_per_gpu: 4

# Extra room for teacher-only rules; overlong sequences fail, never truncate.
max_teacher_context_length: 6144
