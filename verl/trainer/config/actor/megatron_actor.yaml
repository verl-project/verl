# megatron actor config, inheriting from trainer/config/actor/actor.yaml
defaults:
  # megatron optimizer config
  - ../optim@optim: megatron

  # megatron engine config
  - ../engine@megatron: megatron

  - actor

  # load the reference default config, then apply the fields in the current yaml
  - _self_

_target_: verl.workers.config.McoreActorConfig

strategy: megatron

# Megatron-specific checkpoint overrides: swap the base CheckpointConfig for
# McoreCheckpointConfig so the mcore-only knobs (``mbridge_config``,
# ``fully_parallel_save`` / ``fully_parallel_load``) are available.
checkpoint:

  # Target dataclass for this configuration
  _target_: verl.workers.config.McoreCheckpointConfig

  # Whether to wrap Megatron distributed checkpoint saves with the fully-parallel save strategy,
  # which spreads shard writes across the DP(+CP) group.
  fully_parallel_save: True

  # Whether to wrap Megatron distributed checkpoint loads with the fully-parallel load strategy.
  # Setting this to False markedly reduces peak host memory when loading fully_reshardable
  # checkpoints, at the cost of load parallelism.
  fully_parallel_load: True

  # Mbridge config extension.
  # when vanilla_mbridge=True, and your filesystem is a distributed filesystem,(which means you write a file in node A
  # and you can read the file in node B immediately)
  # set `mbridge_config.distributed_filesystem=True` and `mbridge_config.memory_efficient=True` to
  # speed up the checkpoint saving by 10x speed.
  mbridge_config: {}
# Whether to use chunked entropy computation
entropy_from_logits_with_chunking: False

# Chunk size used by chunked entropy computation
entropy_from_logits_chunk_size: 2048

megatron:
  entropy_from_logits_with_chunking: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_with_chunking,False}
  entropy_from_logits_chunk_size: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_chunk_size,2048}
