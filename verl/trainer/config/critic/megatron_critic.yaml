# defaults specify the default config from each component
defaults:

  # megatron optimizer config
  - ../optim@optim: megatron

  # megatron engine config
  - ../engine@megatron: megatron

  # dp actor config, inheriting from trainer/config/critic/critic.yaml
  - critic

  # load the reference default config, then apply the fields in the current yaml
  - _self_

# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.McoreCriticConfig

strategy: megatron

# seconds, default is 10 minutes for torch, you can set it to a larger value if you have long-running operations like 32B or 72B model using megatron
nccl_timeout: 600

# seed for data loader
data_loader_seed: ${oc.select:actor_rollout_ref.actor.data_loader_seed,null}

# Megatron engine settings that follow the actor unless critic-specific values
# are provided by the user.
megatron:

  # Deprecated parameter CPU-offload switch
  param_offload: ${oc.select:actor_rollout_ref.actor.megatron.param_offload,null}

  # Deprecated gradient CPU-offload switch
  grad_offload: ${oc.select:actor_rollout_ref.actor.megatron.grad_offload,null}

  # Deprecated optimizer CPU-offload switch
  optimizer_offload: ${oc.select:actor_rollout_ref.actor.megatron.optimizer_offload,null}

  # Per-state offload policy
  offload:

    # Parameter offload target
    param:
      target: ${oc.select:actor_rollout_ref.actor.megatron.offload.param.target,null}

    # Gradient offload target
    grad:
      target: ${oc.select:actor_rollout_ref.actor.megatron.offload.grad.target,null}

    # Optimizer-state offload target
    optimizer:
      target: ${oc.select:actor_rollout_ref.actor.megatron.offload.optimizer.target,null}

    # Disk backend settings
    disk:
      path: ${oc.select:actor_rollout_ref.actor.megatron.offload.disk.path,null}
      chunk_size_mb: ${oc.select:actor_rollout_ref.actor.megatron.offload.disk.chunk_size_mb,64}
      cleanup_on_exit: ${oc.select:actor_rollout_ref.actor.megatron.offload.disk.cleanup_on_exit,True}

# Megatron-specific checkpoint overrides: swap the base CheckpointConfig for
# McoreCheckpointConfig so ``mbridge_config`` is available.
checkpoint:

  # Target dataclass for this configuration
  _target_: verl.workers.config.McoreCheckpointConfig

  # Mbridge config extension.
  mbridge_config: {}
