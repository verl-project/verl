# defaults specify the default config from each component
defaults:

  # veomni optimizer config
  - ../optim@optim: veomni

  # veomni engine config
  - ../engine@veomni: veomni

  # critic config, inheriting from trainer/config/critic/critic.yaml
  - critic

  # load the reference default config, then apply the fields in the current yaml
  - _self_

# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.VeOmniCriticConfig

strategy: veomni

# seed for data loader
data_loader_seed: ${oc.select:actor_rollout_ref.actor.data_loader_seed,null}

# VeOmni engine offload settings that follow the actor unless critic-specific
# values are provided by the user.
veomni:

  # Deprecated parameter CPU-offload switch
  param_offload: ${oc.select:actor_rollout_ref.actor.veomni.param_offload,null}

  # Deprecated optimizer CPU-offload switch
  optimizer_offload: ${oc.select:actor_rollout_ref.actor.veomni.optimizer_offload,null}

  # Per-state offload policy
  offload:

    # Parameter offload policy
    param:
      target: ${oc.select:actor_rollout_ref.actor.veomni.offload.param.target,null}

    # Optimizer-state offload policy
    optimizer:
      target: ${oc.select:actor_rollout_ref.actor.veomni.offload.optimizer.target,null}

    # Disk backend settings
    disk:
      path: ${oc.select:actor_rollout_ref.actor.veomni.offload.disk.path,null}
      chunk_size_mb: ${oc.select:actor_rollout_ref.actor.veomni.offload.disk.chunk_size_mb,64}
      cleanup_on_exit: ${oc.select:actor_rollout_ref.actor.veomni.offload.disk.cleanup_on_exit,True}

  # Existing VeOmni CPU-offload switch
  enable_fsdp_offload: ${oc.select:actor_rollout_ref.actor.veomni.enable_fsdp_offload,False}
