working_dir: ./
excludes: ["/.git/"]
env_vars:
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  NVTE_BACKWARD_OVERRIDE: "dequantized"
  NVTE_NVFP4_ROW_SCALED_ACTIVATION: "1"
  NVTE_NVFP4_DISABLE_RHT: "1"
  NVTE_NVFP4_DISABLE_STOCHASTIC_ROUNDING: "1"
  NVTE_NVFP4_DISABLE_2D_QUANTIZATION: "1"
  NVTE_NVFP4_4OVER6: "none"
  NVTE_NVFP4_4OVER6_E4M3_USE_256: "all"
  NVTE_NVFP4_4OVER6_ERR_MODE: "MAE"
  FLASHINFER_DISABLE_FP4_QUANT_FAST_MATH: "1"
  TRTLLM_DISABLE_FP4_QUANT_FAST_MATH: "1"
  # vLLM 0.26 reworked MoE loading into RoutedExperts, whose weight_loader wants
  # a per-expert 2D view; verl's legacy model.load_weights hands it the stacked
  # 3D expert parameter and dies. Native reload is the same API the real-NVFP4
  # arm already uses successfully on this vLLM. Worker processes only see env
  # through Ray runtime_env, never through the driver shell.
  VERL_VLLM_NATIVE_RELOAD: "1"
