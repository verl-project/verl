name: e2e_fully_async_policy_opd

on:
  push:
    branches:
      - main
      - v0.*
    paths:
      - "**/*.py"
      - "!**/*.md"
      - "!**/*.sh"
      - "!examples/*trainer*"
      - "!tests/**"
      - "!verl/trainer/main_*.py"
      - "!verl/trainer/fsdp_sft_trainer.py"
      - "verl/experimental/fully_async_policy"
      - "verl/trainer/distillation"
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      - "**/*.py"
      - "!**/*.md"
      - "!**/*.sh"
      - "!examples/**"
      - "!tests/**"
      - "!verl/trainer/main_*.py"
      - "!verl/trainer/fsdp_sft_trainer.py"
      - "verl/experimental/fully_async_policy"
      - "verl/trainer/distillation"
      - ".github/workflows/e2e_fully_async_policy_opd.yml"
      - "examples/data_preprocess/gsm8k.py"
      - "examples/data_preprocess/geo3k.py"
      - "tests/special_e2e/run_fully_async_policy_opd.sh"

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
permissions:
  contents: read

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:uv.cu130"
  DYNAMIC_RUNNER_ENDPOINT: "https://sd10g3clalm04ug7alq90.apigateway-cn-beijing.volceapi.com/runner"

jobs:
  setup:
    if: github.repository_owner == 'verl-project'
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
      - uses: actions/checkout@v4
      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  # Test Multi-Teacher OPD with Megatron strategy
  e2e_fully_async_policy_opd_megatron:
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 30
    env:
      HTTP_PROXY: "http://100.68.174.87:3128"
      HTTPS_PROXY: "http://100.68.174.87:3128"
      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      # No install step: every command below runs through uv, which syncs .venv
      # from the committed uv.lock. These extras must match what the e2e script
      # picks for this backend combo, or each step would re-sync torch.
      UV_RUN: "uv run --frozen --all-packages --extra vllm --extra megatron"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Diagnostic: show whether this runner can reach the outside world at all
      # before uv needs it. Never fails the job.
      - name: Check network connectivity
        run: |
          echo "HTTPS_PROXY is ${HTTPS_PROXY}, NO_PROXY=${NO_PROXY:-unset}"
          curl google.com
          curl -sS -m 20 -o /dev/null -r 0-0 -L -w 'wheelhouse asset: %{http_code}\n' https://github.com/ETOgaosion/verl-wheelhouse/releases/download/flash-attention-v2.8.3/flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl || echo "wheelhouse asset: unreachable"
      - name: Keep the uv cache on the runner's persistent ${HOME}
        run: |
          echo "HOME=${HOME} (uv cache baked into the image: ${UV_CACHE_DIR})"
          echo "UV_CACHE_DIR=${HOME}/.cache/uv" | tee -a "${GITHUB_ENV}"
      - name: Check final pip list
        run: |
          $UV_RUN uv pip list
      - name: Prepare datasets
        run: |
          $UV_RUN python3 examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/models/hf_data/gsm8k
          $UV_RUN python3 examples/data_preprocess/geo3k.py --local_dataset_path ${HOME}/models/hf_data/hiyouga/geometry3k/ --local_save_dir ${HOME}/data/geo3k
      - name: Running the E2E test with fully_async_policy + Multi-Teacher OPD (Megatron)
        run: |
          $UV_RUN ray stop --force
          bash tests/special_e2e/run_fully_async_policy_opd.sh

  cleanup:
    runs-on: ubuntu-latest
    needs: [setup, e2e_fully_async_policy_opd_megatron]
    if: always()
    steps:
      - id: destroy-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "destroy"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-task-id: "${{ needs.setup.outputs.mlp-task-id }}"
