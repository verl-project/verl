name: e2e_v1_separate_async_opd

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.*
    paths:
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/distillation/**"
      - "verl/trainer/config/**"
      - "verl/experimental/agent_loop/**"
      - "verl/experimental/separation/**"
      - "verl/experimental/teacher_loop/**"
      - "verl/checkpoint_engine/**"
      - "verl/models/**"
      - "verl/single_controller/**"
      - "verl/workers/**"
      - "verl/utils/dataset/**"
      - "verl/utils/megatron_utils.py"
      - "verl/protocol.py"
      - ".github/workflows/e2e_v1_separate_async_opd.yml"
      - "tests/special_e2e/run_v1_separate_async_opd.sh"
      - "examples/data_preprocess/gsm8k.py"
      - "examples/data_preprocess/geo3k.py"
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/distillation/**"
      - "verl/trainer/config/**"
      - "verl/experimental/agent_loop/**"
      - "verl/experimental/separation/**"
      - "verl/experimental/teacher_loop/**"
      - "verl/checkpoint_engine/**"
      - "verl/models/**"
      - "verl/single_controller/**"
      - "verl/workers/**"
      - "verl/utils/dataset/**"
      - "verl/utils/megatron_utils.py"
      - "verl/protocol.py"
      - ".github/workflows/e2e_v1_separate_async_opd.yml"
      - "tests/special_e2e/run_v1_separate_async_opd.sh"
      - "examples/data_preprocess/gsm8k.py"
      - "examples/data_preprocess/geo3k.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:vllm024.dev2"
  DYNAMIC_RUNNER_ENDPOINT: "https://sd10g3clalm04ug7alq90.apigateway-cn-beijing.volceapi.com/runner"
  PYTHONPATH: "/workspace/Megatron-LM"

jobs:
  setup:
    if: github.repository_owner == 'verl-project'
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
      - uses: actions/checkout@v4
      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  e2e_v1_separate_async_opd_megatron:
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 30
    env:
      HTTPS_PROXY: ${{ secrets.PROXY_HTTPS }}
      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install the current repository
        run: |
          pip3 install -r requirements-test.txt
          pip3 install -r requirements.txt
          pip3 install --no-deps -e .
          pip3 install --no-deps TransferQueue==0.1.8
          pip3 install cupy-cuda13x==13.6.0
          pip3 install "nvidia-modelopt>=0.37.0"
      - name: Check final pip list
        run: pip3 list
      - name: Prepare datasets
        run: |
          python3 examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/models/hf_data/gsm8k --local_save_dir ${HOME}/data/gsm8k
          python3 examples/data_preprocess/geo3k.py --local_dataset_path ${HOME}/models/hf_data/hiyouga/geometry3k/ --local_save_dir ${HOME}/data/geo3k
      - name: Run V1 separate_async with Multi-Teacher OPD
        run: |
          ray stop --force
          bash tests/special_e2e/run_v1_separate_async_opd.sh

  cleanup:
    runs-on: ubuntu-latest
    needs: [setup, e2e_v1_separate_async_opd_megatron]
    if: always()
    steps:
      - id: destroy-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "destroy"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-task-id: "${{ needs.setup.outputs.mlp-task-id }}"
