name: docker-build-ascend-a2-uniagent

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish to quay.io/ascend/verl"
        required: true
        default: "latest-vllm-910b-ubuntu-for-uniagent"
        type: string

env:
  QUAY_REPO: quay.io/ascend/verl
  DOCKERFILE: docker/ascend/Dockerfile.ascend_8.5.2_a2_uni-agent

jobs:
  build-and-push:
    name: build-and-push-uniagent
    if: ${{ github.repository_owner == 'verl-project' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Remove unnecessary parts in GitHub Actions runner to free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push uni-agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.QUAY_REPO }}:${{ inputs.image_tag }}
          provenance: false
          cache-from: type=gha,scope=ascend-a2-uniagent
          cache-to: type=gha,mode=max,scope=ascend-a2-uniagent
