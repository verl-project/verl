name: docker-build-ascend-a2-uniagent

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish to quay.io/ascend/verl"
        required: true
        default: "latest-vllm-910b-ubuntu-for-uniagent"
        type: string
  pull_request:
    paths:
      - "docker/ascend/Dockerfile.ascend_8.5.2_a2_uni-agent"
      - ".github/workflows/docker-build-ascend-a2-for-uniagent.yml"

env:
  QUAY_REPO: quay.io/ascend/verl
  QUAY_TEMP_REPO: quay.io/yezib/verltest
  DOCKERFILE: docker/ascend/Dockerfile.ascend_8.5.2_a2_uni-agent

jobs:
  # Build each architecture natively. Manual runs publish architecture-specific
  # digests to the temporary repository; pull requests only validate the build.
  build-push-digest:
    name: build-${{ matrix.tag }}
    if: ${{ github.repository_owner == 'verl-project' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.tag }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux/amd64
            runner: ubuntu-latest
            tag: amd64
          - arch: linux/arm64
            runner: ubuntu-22.04-arm
            tag: arm64
    steps:
      - name: Remove unnecessary parts in GitHub Actions runner to free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container
          use: true

      - name: Login to temporary Quay.io repository
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME_TMP }}
          password: ${{ secrets.QUAY_PASSWORD_TMP }}

      - name: Clean Docker cache before build
        run: docker system prune -a -f --volumes || true

      - name: Validate uni-agent image build for pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.arch }}
          file: ${{ env.DOCKERFILE }}
          push: false
          provenance: false
          cache-from: type=gha,scope=ascend-a2-uniagent-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=ascend-a2-uniagent-${{ matrix.tag }}

      - name: Build and push digest to temporary repository
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.arch }}
          file: ${{ env.DOCKERFILE }}
          push: true
          outputs: type=image,name=${{ env.QUAY_TEMP_REPO }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=ascend-a2-uniagent-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=ascend-a2-uniagent-${{ matrix.tag }}

      # Prevent Quay.io from garbage-collecting the untagged digest before merge.
      - name: Tag digest to prevent garbage collection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.QUAY_TEMP_REPO }}:tmp-a2-uniagent-${{ matrix.tag }}" \
            "${{ env.QUAY_TEMP_REPO }}@${{ steps.build.outputs.digest }}"

      - name: Export digest
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-uniagent-${{ matrix.tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the two digests into the one public multi-architecture image.
  merge-image:
    name: merge
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: build-push-digest
    permissions:
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-uniagent-*
          merge-multiple: true

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Merge and push multi-architecture image
        env:
          SOURCE_IMAGE: ${{ env.QUAY_TEMP_REPO }}
          TARGET_IMAGE: ${{ env.QUAY_REPO }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          DIGESTS=$(printf "$SOURCE_IMAGE@sha256:%s " $(ls "${{ runner.temp }}/digests"))
          echo "Image digests: $DIGESTS"
          docker buildx imagetools create \
            -t "$TARGET_IMAGE:$IMAGE_TAG" \
            $DIGESTS

      - name: Login to temporary Quay.io repository for cleanup
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME_TMP }}
          password: ${{ secrets.QUAY_PASSWORD_TMP }}

      - name: Delete temporary tags
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          chmod +x crane
          ./crane delete ${{ env.QUAY_TEMP_REPO }}:tmp-a2-uniagent-amd64 || true
          ./crane delete ${{ env.QUAY_TEMP_REPO }}:tmp-a2-uniagent-arm64 || true
