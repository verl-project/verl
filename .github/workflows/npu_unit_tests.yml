# # Tests layout

# Each folder under tests/ corresponds to a test category for a sub-namespace in verl. For instance:
# - `tests/trainer` for testing functionality related to `verl/trainer`
# - `tests/models` for testing functionality related to `verl/models`
# - ...

# There are a few folders with `special_` prefix, created for special purposes:
# - `special_distributed`: unit tests that must run with multiple GPUs
# - `special_e2e`: end-to-end tests with training/generation scripts
# - `special_npu`: tests for NPUs
# - `special_sanity`: a suite of quick sanity tests
# - `special_standalone`: a set of test that are designed to run in dedicated environments

# Accelerators for tests
# - By default tests are run with GPU available, except for the ones under `special_npu`, and any test script whose name ends with `on_cpu.py`.
# - For test scripts with `on_cpu.py` name suffix would be tested on CPU resources in linux environment.

# # Workflow layout

# All CI tests are configured by yaml files in `.github/workflows/`. Here's an overview of all test configs:
# 1. A list of always triggered CPU sanity tests: `check-pr-title.yml`, `secrets_scan.yml`, `check-pr-title,yml`, `pre-commit.yml`, `doc.yml`
# 2. Some heavy multi-GPU unit tests, such as `model.yml`, `vllm.yml`, `sgl.yml`
# 3. End-to-end tests: `e2e_*.yml`
# 4. Unit tests
#   - `cpu_unit_tests.yml`, run pytest on all scripts with file name pattern `tests/**/test_*_on_cpu.py`
#   - `gpu_unit_tests.yml`, run pytest on all scripts with file without the `on_cpu.py` suffix.
#   - `npu_unit_tests.yml`, run pytest on all scripts with file without the `on_cpu.py` suffix on ascend device.
#   - Since cpu/gpu/npu unit tests by default runs all tests under `tests`, please make sure tests are manually excluded in them when
#     - new workflow yaml is added to `.github/workflows`
#     - new tests are added to workflow mentioned in 2.

name: NPU unit tests

on:
  # Trigger on pull requests targeting main or v0.* branches.
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      # The order that you define paths patterns matters:
      # A matching negative pattern (prefixed with !) after a positive match will exclude the path.
      # A matching positive pattern after a negative match will include the path again.
      - "**/*.py"
      # Other entrypoints
      - "!examples/**"
      - "!tests/special_sanity/**"
      - "!verl/trainer/main_*.py"
      - "!verl/trainer/fsdp_sft_trainer.py"
      - "!recipe/**"
      # Entrypoints
      - .github/workflows/npu_unit_tests.yml
      - "tests/**test_*.py"
      # Ignore CPU tests
      - "!tests/*_on_cpu.py"

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
permissions:
  contents: read

jobs:
  npu_unit_tests:
    if: github.repository_owner == 'verl-project'
    runs-on: linux-aarch64-a3-800i-8
    timeout-minutes: 60 # Increase this timeout value as needed
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: >-
        --shm-size 16g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      VERL_USE_EXTERNAL_MODULES: "megatron_adaptor" # import megatron_adaptor to patch megatron-lm
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      UV_HTTP_TIMEOUT: 120
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
    steps:
      - name: Check npu and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Install uv
        run: pip install uv
      - name: Check initial pip list from image
        run: |
          uv pip list
      - name: Checkout verl-project/verl repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Install the current repository
        run: |
          # Match the GPU CI ModelOpt version and keep the shared quantization tests unchanged.
          uv pip install mlflow pytest-asyncio "nvidia-modelopt==0.44.0"
      - name: Check final pip list
        run: |
          uv pip list
      - name: Prepare weights
        run: |
          ln -s /root/.cache/modelscope/hub/models ~/models
      - name: Run all NPU unit tests
        shell: bash
        env:
          # Enable before pytest imports so its plugin leaves the handler enabled at teardown.
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          NPU_CI_DIAGNOSTICS: ${{ runner.temp }}/npu-unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$NPU_CI_DIAGNOSTICS"
          {
            date -u --iso-8601=seconds
            printf 'runner=%s run=%s attempt=%s\n' "$RUNNER_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'checkout='; git rev-parse HEAD
            uname -a
            printf 'core_limit='; ulimit -c
            printf 'core_pattern='; cat /proc/sys/kernel/core_pattern
          } | tee "$NPU_CI_DIAGNOSTICS/environment.log" || echo "::warning::Environment snapshot incomplete"
          # Keep pytest options out of sys.argv: MegatronAdaptor parses it during imports.
          # -c also avoids a <stdin> main module that multiprocessing.spawn cannot reload.
          # Preserve the Python process exit status, including a fault after pytest returns.
          set +e
          python -c '
          import atexit
          import faulthandler
          import os
          import sys
          import time

          def marker(event):
              print(f"NPU_CI_DIAGNOSTIC time={time.time():.6f} pid={os.getpid()} {event}",
                    file=sys.stderr, flush=True)

          def snapshot_maps(stage):
              # Read mappings only; do not import native modules or initialize devices.
              try:
                  with open("/proc/self/maps") as source:
                      with open(os.path.join(os.environ["NPU_CI_DIAGNOSTICS"], stage + ".maps"), "w") as target:
                          target.write(source.read())
              except OSError as error:
                  marker(f"maps_unavailable stage={stage} error={error!r}")

          faulthandler.enable(all_threads=True)
          # LIFO: this callback runs after callbacks registered by subsequent imports/tests.
          # It does not mark completion of C/C++ destructors or interpreter finalization.
          atexit.register(marker, "early_registered_atexit_reached")
          marker(f"process_start executable={sys.executable} python={sys.version!r} argv={sys.argv!r}")
          import pytest

          class ExitDiagnostics:
              @pytest.hookimpl(wrapper=True, tryfirst=True)
              def pytest_sessionfinish(self, session, exitstatus):
                  marker(f"sessionfinish_begin exitstatus={int(exitstatus)}")
                  snapshot_maps("sessionfinish")
                  try:
                      yield
                  finally:
                      marker("sessionfinish_end")

              @pytest.hookimpl(trylast=True)
              def pytest_unconfigure(self, config):
                  marker("pytest_unconfigure")

          marker(f"pytest_start version={pytest.__version__}")
          exit_code = pytest.main([
              "-s",
              "-x",
              "--ignore-glob=*test_special_*.py",
              "--ignore-glob=*on_cpu.py",
              "--ignore-glob=*test_vllm*",
              "--ignore-glob=*_sglang*",
              "--ignore-glob=*_hf_rollout*",
              "--ignore-glob=tests/models/",
              "--ignore-glob=tests/special*",
              "--ignore-glob=tests/experimental",
              "--ignore-glob=tests/workers/reward_model",
              "--ignore-glob=*test_rvdz*",
              "--ignore-glob=*test_ray_collectives*",
              "--ignore-glob=*test_nvtx_profile*",
              "--ignore-glob=tests/checkpoint_engine",
              "--ignore-glob=*test_shared_memory*",
              "--ignore-glob=tests/workers/rollout/rollout_trtllm",
              "--ignore-glob=*test_fsdp_lora_merge*",
              "--ignore-glob=*test_optimizer_offload_and_load.py*",
              "tests/",
              "-k",
              "not test_preprocess_bshd_engine_preserves_topk_dense_dim_on_gpu and not test_sender_accepts_strided_tensor",
          ], plugins=[ExitDiagnostics()])
          marker(f"pytest_returned exit_code={int(exit_code)} faulthandler={faulthandler.is_enabled()}")
          # Register immediately so the first callback marks entry into Python atexit.
          atexit.register(marker, "late_registered_atexit_reached")
          snapshot_maps("pytest-returned")
          raise SystemExit(exit_code)
          ' 2>&1 | tee "$NPU_CI_DIAGNOSTICS/pytest.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf 'NPU_CI_DIAGNOSTIC python_exit_code=%s tee_exit_code=%s\n' "${pipeline_status[0]}" "${pipeline_status[1]}" \
            | tee "$NPU_CI_DIAGNOSTICS/process-exit.log"
          if [ "${pipeline_status[0]}" -ne 0 ]; then
            exit "${pipeline_status[0]}"
          fi
          exit "${pipeline_status[1]}"
      - name: Upload NPU unit test exit diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: npu-unit-tests-exit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npu-unit-tests-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Running NPU profiling unit tests
        run: |
          # Keep pytest options out of sys.argv: MegatronAdaptor parses it during imports.
          # -c also avoids a <stdin> main module that multiprocessing.spawn cannot reload.
          python -c '
          import pytest

          raise SystemExit(pytest.main([
              "-s",
              "-x",
              "tests/utils/test_special_mstx_profile.py",
          ]))
          '
      - name: Running FSDP2 NPU model transfer regression
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" torchrun --standalone --nproc-per-node=2 tests/special_distributed/test_fsdp2_model_cpu_offload.py
      - name: Running NPU checkpoint_engine unit tests
        id: checkpoint_baseline
        timeout-minutes: 8
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          VERL_CHECKPOINT_DIAGNOSTICS_DIR: ${{ runner.temp }}/checkpoint-weights-${{ github.run_id }}-${{ github.run_attempt }}/baseline
          VERL_CHECKPOINT_WEIGHT_FINGERPRINTS: "0"
        run: |
          mkdir -p "$VERL_CHECKPOINT_DIAGNOSTICS_DIR"
          # Keep pytest options out of sys.argv: MegatronAdaptor parses it during imports.
          # -c also avoids a <stdin> main module that multiprocessing.spawn cannot reload.
          # Run both bucket sizes even when the first case fails.
          set +e
          python -c '
          import pytest

          raise SystemExit(pytest.main([
              "-s",
              "tests/checkpoint_engine/test_correctness_on_npu.py",
          ]))
          ' 2>&1 | tee "$VERL_CHECKPOINT_DIAGNOSTICS_DIR/pytest.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf 'python_exit_code=%s tee_exit_code=%s\n' "${pipeline_status[0]}" "${pipeline_status[1]}" \
            > "$VERL_CHECKPOINT_DIAGNOSTICS_DIR/process-exit.log"
          if [ "${pipeline_status[0]}" -ne 0 ]; then exit "${pipeline_status[0]}"; fi
          exit "${pipeline_status[1]}"
      - name: Diagnose NPU checkpoint weights with CPU fingerprints
        id: checkpoint_fingerprints
        if: ${{ !cancelled() && steps.checkpoint_baseline.outcome == 'failure' }}
        timeout-minutes: 16
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          VERL_CHECKPOINT_WEIGHT_FINGERPRINTS: "1"
          VERL_CHECKPOINT_DIAGNOSTICS_DIR: ${{ runner.temp }}/checkpoint-weights-${{ github.run_id }}-${{ github.run_attempt }}/fingerprints
        run: |
          mkdir -p "$VERL_CHECKPOINT_DIAGNOSTICS_DIR"
          # This separate control synchronizes/copies tensors; it may hide a timing bug.
          set +e
          python -c '
          import pytest

          raise SystemExit(pytest.main([
              "-s",
              "tests/checkpoint_engine/test_correctness_on_npu.py",
          ]))
          ' 2>&1 | tee "$VERL_CHECKPOINT_DIAGNOSTICS_DIR/pytest.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf 'python_exit_code=%s tee_exit_code=%s\n' "${pipeline_status[0]}" "${pipeline_status[1]}" \
            > "$VERL_CHECKPOINT_DIAGNOSTICS_DIR/process-exit.log"
          if [ "${pipeline_status[0]}" -ne 0 ]; then exit "${pipeline_status[0]}"; fi
          exit "${pipeline_status[1]}"
      - name: Summarize NPU checkpoint weight diagnostics
        if: ${{ !cancelled() && (steps.checkpoint_baseline.outcome == 'success' || steps.checkpoint_baseline.outcome == 'failure') }}
        env:
          CHECKPOINT_DIAGNOSTICS_ROOT: ${{ runner.temp }}/checkpoint-weights-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -c 'import os; from tests.checkpoint_engine.weight_diagnostics import summarize; summarize(os.environ["CHECKPOINT_DIAGNOSTICS_ROOT"])'
      - name: Upload NPU checkpoint weight diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: npu-checkpoint-weights-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint-weights-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Running CPU checkpoint_engine unit tests
        run: |
          # Keep pytest options out of sys.argv: MegatronAdaptor parses it during imports.
          # -c also avoids a <stdin> main module that multiprocessing.spawn cannot reload.
          python -c '
          import pytest

          raise SystemExit(pytest.main([
              "-s",
              "-x",
              "tests/checkpoint_engine/test_global_steps_on_cpu.py",
          ]))
          '
