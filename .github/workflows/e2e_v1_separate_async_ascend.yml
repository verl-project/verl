name: e2e_v1_separate_async_ascend

on:
  # Temporarily paused for the coverage-only run; uncomment these events to restore normal CI.
  # workflow_dispatch: null
  # pull_request:
  #   branches:
  #     - main
  #     - v0.*
  #   paths:
  #     - ".github/workflows/e2e_v1_separate_async_ascend.yml"
  #     - "tests/special_e2e/run_v1_separate_async.sh"
  #     - "tests/special_e2e/run_v1_separate_async_ascend.sh"
  #     - "examples/data_preprocess/gsm8k.py"
  #     - "verl/trainer/main_ppo.py"
  #     - "verl/trainer/ppo/v1/**"
  #     - "verl/trainer/config/**"
  #     - "verl/checkpoint_engine/**"
  #     - "verl/experimental/separation/**"
  #     - "verl/models/**"
  #     - "verl/single_controller/**"
  #     - "verl/workers/**"
  #     - "verl/utils/device.py"
  #     - "verl/utils/distributed.py"
  #     - "verl/utils/fsdp_utils.py"
  #     - "verl/utils/megatron_utils.py"
  #     - "verl/utils/transferqueue_utils.py"
  #     - "requirements-npu.txt"
  #     - "pyproject.toml"
  #     - "setup.py"
  workflow_call:
    inputs:
      coverage_mode:
        description: Collect raw branch coverage for the existing workload steps
        type: boolean
        required: false
        default: false

concurrency:
  group: e2e_v1_separate_async_ascend-${{ inputs.coverage_mode && 'coverage' || 'pr' }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.coverage_mode && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  VERL_COVERAGE_ENABLED: ${{ inputs.coverage_mode }}
  # Disposable caches and locks must stay off the read-only dataset/model mounts.
  HF_DATASETS_CACHE: /root/.cache/temp/hf-datasets
  MEGATRON_CONFIG_LOCK_DIR: /root/.cache/temp/megatron-config-locks
  # This image is not the uv.cu130 one: it ships its own torch-npu stack, so the
  # shared e2e scripts must launch with ambient python instead of `uv run`.
  VERL_USE_UV: 0

jobs:
  e2e_v1_separate_async_fsdp2_ascend:
    if: github.repository_owner == 'verl-project'
    runs-on: linux-aarch64-a3-800i-16
    timeout-minutes: ${{ inputs.coverage_mode && 150 || 60 }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: >-
        --shm-size 16g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      ACTOR_STRATEGY: "fsdp2"
      device_name: "npu"
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      UV_HTTP_TIMEOUT: 120
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - name: Check NPU and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Install uv
        run: pip install uv
      - name: Check initial pip list
        run: uv pip list
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Install the current repository
        run: |
          uv pip install --no-deps -e .
          uv pip install --no-deps TransferQueue==0.1.11
      - name: Check final pip list
        run: uv pip list
      - name: Prepare weights
        run: ln -s /root/.cache/modelscope/hub/models "${HOME}/models"
      - name: Initialize coverage (optional)
        if: inputs.coverage_mode
        shell: bash
        env:
          VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/e2e_v1_separate_async_ascend.yml/${{ github.job }}/data
          VERL_COVERAGE_WORKFLOW: e2e_v1_separate_async_ascend.yml
          VERL_COVERAGE_JOB: ${{ github.job }}
        run: |
          # Persist identity for subsequent workload steps, but not instrumentation.
          printf 'VERL_COVERAGE_ROOT=%s\n' "$VERL_COVERAGE_ROOT" >> "$GITHUB_ENV"
          printf 'VERL_COVERAGE_WORKFLOW=%s\n' "$VERL_COVERAGE_WORKFLOW" >> "$GITHUB_ENV"
          printf 'VERL_COVERAGE_JOB=%s\n' "$VERL_COVERAGE_JOB" >> "$GITHUB_ENV"
          command -v uv >/dev/null || python -m pip install uv
          uv pip install --python "$(python -c 'import sys; print(sys.executable)')" "coverage==7.8.2" "PyYAML==6.0.2"
          python scripts/ci/coverage/collect.py init
      - name: Prepare GSM8K dataset
        run: python examples/data_preprocess/gsm8k.py --local_dataset_path "${HOME}/.cache/modelscope/dataset/openai/gsm8k"
        shell: python scripts/ci/coverage/collect.py run step-07 {0}
      - name: Print system memory before tests
        run: |
          awk '/^(MemTotal|MemFree|MemAvailable|Cached|Buffers|AnonPages|Shmem|Slab):/ {
              printf "%-16s %10.3f GiB\n", $1, $2/1048576
          }' /proc/meminfo
      - name: Run V1 separate_async with FSDP2
        run: |
          ray stop --force
          bash tests/special_e2e/run_v1_separate_async_ascend.sh

        shell: python scripts/ci/coverage/collect.py run step-09 {0}
      - name: Package coverage (optional)
        if: ${{ always() && inputs.coverage_mode }}
        shell: bash
        env:
          VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/e2e_v1_separate_async_ascend.yml/${{ github.job }}/data
        run: python scripts/ci/coverage/collect.py package
      - name: Retain coverage (optional)
        if: ${{ always() && inputs.coverage_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: ascend-coverage-e2e_v1_separate_async_ascend.yml-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/e2e_v1_separate_async_ascend.yml/${{ github.job }}/coverage.tar.gz
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14
  e2e_v1_separate_async_megatron_ascend:
    if: github.repository_owner == 'verl-project'
    needs: e2e_v1_separate_async_fsdp2_ascend
    runs-on: linux-aarch64-a3-800i-16
    timeout-minutes: ${{ inputs.coverage_mode && 150 || 60 }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: >-
        --shm-size 16g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      ACTOR_STRATEGY: "megatron"
      device_name: "npu"
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      UV_HTTP_TIMEOUT: 120
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - name: Check NPU and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Install uv
        run: pip install uv
      - name: Check initial pip list
        run: uv pip list
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Install the current repository
        run: |
          uv pip install --no-deps -e .
          uv pip install --no-deps TransferQueue==0.1.11
      - name: Check final pip list
        run: uv pip list
      - name: Prepare weights
        run: ln -s /root/.cache/modelscope/hub/models "${HOME}/models"
      - name: Initialize coverage (optional)
        if: inputs.coverage_mode
        shell: bash
        env:
          VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/e2e_v1_separate_async_ascend.yml/${{ github.job }}/data
          VERL_COVERAGE_WORKFLOW: e2e_v1_separate_async_ascend.yml
          VERL_COVERAGE_JOB: ${{ github.job }}
        run: |
          # Persist identity for subsequent workload steps, but not instrumentation.
          printf 'VERL_COVERAGE_ROOT=%s\n' "$VERL_COVERAGE_ROOT" >> "$GITHUB_ENV"
          printf 'VERL_COVERAGE_WORKFLOW=%s\n' "$VERL_COVERAGE_WORKFLOW" >> "$GITHUB_ENV"
          printf 'VERL_COVERAGE_JOB=%s\n' "$VERL_COVERAGE_JOB" >> "$GITHUB_ENV"
          command -v uv >/dev/null || python -m pip install uv
          uv pip install --python "$(python -c 'import sys; print(sys.executable)')" "coverage==7.8.2" "PyYAML==6.0.2"
          python scripts/ci/coverage/collect.py init
      - name: Prepare GSM8K dataset
        run: python examples/data_preprocess/gsm8k.py --local_dataset_path "${HOME}/.cache/modelscope/dataset/openai/gsm8k"
        shell: python scripts/ci/coverage/collect.py run step-07 {0}
      - name: Print system memory before tests
        run: |
          awk '/^(MemTotal|MemFree|MemAvailable|Cached|Buffers|AnonPages|Shmem|Slab):/ {
              printf "%-16s %10.3f GiB\n", $1, $2/1048576
          }' /proc/meminfo
      - name: Run V1 separate_async with Megatron
        run: |
          ray stop --force
          bash tests/special_e2e/run_v1_separate_async_ascend.sh
        shell: python scripts/ci/coverage/collect.py run step-09 {0}
      - name: Package coverage (optional)
        if: ${{ always() && inputs.coverage_mode }}
        shell: bash
        env:
          VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/e2e_v1_separate_async_ascend.yml/${{ github.job }}/data
        run: python scripts/ci/coverage/collect.py package
      - name: Retain coverage (optional)
        if: ${{ always() && inputs.coverage_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: ascend-coverage-e2e_v1_separate_async_ascend.yml-${{ github.job }}-${{ github.run_attempt }}
