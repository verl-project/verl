name: e2e_v1_separate_async_trtllm

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:trtllm-1.3.0rc15"
  DYNAMIC_RUNNER_ENDPOINT: "https://sd10g3clalm04ug7alq90.apigateway-cn-beijing.volceapi.com/runner"
  PYTHONPATH: "/workspace/Megatron-LM"

jobs:
  setup:
    if: github.repository_owner == 'verl-project'
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
      - uses: actions/checkout@v4
      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  trtllm_async_unit_tests:
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 30
    env:
      HTTPS_PROXY: ${{ secrets.PROXY_HTTPS }}
      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      TORCH_CUDA_ARCH_LIST: "7.5;8.0;8.9;9.0;10.0;12.0+PTX"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reinstall FlashInfer for runtime GPU arch
        run: |
          unset TORCH_CUDA_ARCH_LIST
          pip3 install --force-reinstall --no-deps flashinfer-python
      - name: Install the current repository
        run: |
          pip3 install pytest-asyncio
          pip3 install -r requirements-test.txt
          pip3 install --no-deps -e .
          pip3 install --no-deps transformers==5.3.0
          pip3 install --no-deps TransferQueue==0.1.8
      - name: Run TRT-LLM abort and resume test
        run: |
          unset TORCH_CUDA_ARCH_LIST
          export TRTLLM_ENABLE_PDL=0
          export TRTLLM_TEST_MODEL_PATH_ROOT="${HOME}/models"
          ray stop --force
          pytest -v -s --durations=20 \
            tests/workers/rollout/rollout_trtllm/test_trtllm_abort.py

  e2e_v1_separate_async_trtllm_megatron_multi_replica:
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 20
    env:
      HTTP_PROXY: ${{ secrets.PROXY_HTTP }}
      HTTPS_PROXY: ${{ secrets.PROXY_HTTPS }}
      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      TORCH_CUDA_ARCH_LIST: "7.5;8.0;8.9;9.0;10.0;12.0+PTX"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reinstall FlashInfer for runtime GPU arch
        run: |
          unset TORCH_CUDA_ARCH_LIST
          pip3 install --force-reinstall --no-deps flashinfer-python
      - name: Install the current repository
        run: |
          pip3 install -r requirements-test.txt
          pip3 install -r requirements.txt
          pip3 install --no-deps -e .
          pip3 install --no-deps transformers==5.3.0
          pip3 install --no-deps TransferQueue==0.1.8
          pip3 install cupy-cuda12x==14.0.1
          pip3 uninstall -y mbridge
          pip3 install git+https://github.com/NVIDIA-NeMo/Megatron-Bridge.git@e2cfe7e --ignore-requires-python --no-deps --no-build-isolation
          pip3 install git+https://github.com/NVIDIA/Megatron-LM.git@0823c73 --ignore-requires-python --no-deps --no-build-isolation
          pip3 install "nvidia-modelopt>=0.37.0"
      - name: Check final pip list
        run: pip3 list
      - name: Prepare GSM8K dataset
        run: |
          python3 examples/data_preprocess/gsm8k.py \
            --local_dataset_path "${HOME}/models/hf_data/gsm8k" \
            --local_save_dir "${HOME}/data/gsm8k"
      - name: Run V1 separate_async TRT-LLM with Megatron
        run: |
          unset TORCH_CUDA_ARCH_LIST
          export TRTLLM_ENABLE_PDL=0
          ray stop --force
          bash tests/special_e2e/run_v1_separate_async_trtllm.sh

  cleanup:
    runs-on: ubuntu-latest
    needs:
      - setup
      - trtllm_async_unit_tests
      - e2e_v1_separate_async_trtllm_megatron_multi_replica
    if: always()
    steps:
      - id: destroy-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "destroy"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-task-id: "${{ needs.setup.outputs.mlp-task-id }}"
