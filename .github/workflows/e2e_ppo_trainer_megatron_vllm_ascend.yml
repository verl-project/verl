# # Tests layout

# Each folder under tests/ corresponds to a test category for a sub-namespace in verl. For instance:
# - `tests/trainer` for testing functionality related to `verl/trainer`
# - `tests/models` for testing functionality related to `verl/models`
# - ...

# There are a few folders with `special_` prefix, created for special purposes:
# - `special_distributed`: unit tests that must run with multiple GPUs
# - `special_e2e`: end-to-end tests with training/generation scripts
# - `special_npu`: tests for NPUs
# - `special_sanity`: a suite of quick sanity tests
# - `special_standalone`: a set of test that are designed to run in dedicated environments

# Accelerators for tests
# - By default tests are run with GPU available, except for the ones under `special_npu`, and any test script whose name ends with `on_cpu.py`.
# - For test scripts with `on_cpu.py` name suffix would be tested on CPU resources in linux environment.

# # Workflow layout

# All CI tests are configured by yaml files in `.github/workflows/`. Here's an overview of all test configs:
# 1. A list of always triggered CPU sanity tests: `check-pr-title.yml`, `secrets_scan.yml`, `check-pr-title,yml`, `pre-commit.yml`, `doc.yml`
# 2. Some heavy multi-GPU unit tests, such as `model.yml`, `vllm.yml`, `sgl.yml`
# 3. End-to-end tests: `e2e_*.yml`
# 4. Unit tests
#   - `cpu_unit_tests.yml`, run pytest on all scripts with file name pattern `tests/**/test_*_on_cpu.py`
#   - `gpu_unit_tests.yml`, run pytest on all scripts with file without the `on_cpu.py` suffix.
#   - Since cpu/gpu unit tests by default runs all tests under `tests`, please make sure tests are manually excluded in them when
#     - new workflow yaml is added to `.github/workflows`
#     - new tests are added to workflow mentioned in 2.

name: e2e_ppo_trainer_megatron_vllm_ascend

on:
  # Trigger on pull requests targeting main or v0.* branches.
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      # Entrypoints and fixtures used by the job below.
      - ".github/workflows/e2e_ppo_trainer_megatron_vllm_ascend.yml"
      - "examples/data_preprocess/geo3k.py"
      - "examples/grpo_trainer/run_qwen3_5_35b_megatron.sh"
      - "tests/special_npu/run_qwen3_5_35b_grpo_megatron.sh"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/config/ppo_megatron_trainer.yaml"
      - "verl/trainer/ppo/**"
      - "verl/workers/engine_workers.py"
      - "verl/workers/engine/**"
      - "verl/workers/rollout/**"
      - "verl/utils/megatron_utils.py"
      - "pyproject.toml"
      - "requirements-npu.txt"
      - "setup.py"

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Disposable cache; preprocessing rebuilds it when missing.
  HF_DATASETS_CACHE: /root/.cache/temp/hf-datasets
  MEGATRON_CONFIG_LOCK_DIR: /root/.cache/temp/megatron-config-locks

jobs:
  e2e_ppo_trainer_megatron-qwen3_5-35b_ascend:
    if: ${{ !startsWith(github.event.pull_request.head.label, 'fangweii1:debug/ascend-multinode-hccl-diagnostics') && (github.repository_owner == 'verl-project') }}
    name: E2E Ascend GRPO Qwen3.5-35B Megatron testing
    runs-on: linux-aarch64-a3-800i-16
    timeout-minutes: 120 # Increase this timeout value as needed
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: >-
        --shm-size 60g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - name: Check npu and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Check initial pip list from image
        run: |
          pip list
      - name: Checkout verl-project/verl repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Install the current repository
        run: |
          pip install --no-deps -e .
          pip install --no-deps TransferQueue==0.1.11
      - name: Update MindSpeed-Bridge checkout
        run: |
          # The image ships a MindSpeed-Bridge snapshot frozen at image build
          # time; fla_npu >= v26.9.0 dropped the legacy torch.ops.npu.*
          # registration and current bridge calls the operators through the
          # stable fla_npu.ops.ascendc entry instead. Refresh the editable
          # install (pip install -e /MindSpeed-Bridge) to the current master.
          cd /MindSpeed-Bridge
          git fetch --depth 1 origin master
          git checkout --detach FETCH_HEAD
          grep -q "from fla_npu.ops import ascendc" \
            mindspeed_bridge/models/qwen_vl/modelling_qwen3_vl/flash_gated_delta_rule.py
      - name: Check final pip list
        run: |
          pip list
      - name: Preprocess geo3k dataset
        run: |
          python examples/data_preprocess/geo3k.py --local_dataset_path ${HOME}/.cache/modelscope/dataset/hiyouga/geometry3k
      - name: Print system memory before tests
        run: |
          awk '/^(MemTotal|MemFree|MemAvailable|Cached|Buffers|AnonPages|Shmem|Slab):/ {
              printf "%-16s %10.3f GiB\n", $1, $2/1048576
          }' /proc/meminfo
      - name: Running GRPO Qwen3.5-35B Megatron E2E training test on Ascend NPUs
        env:
          MODEL_PATH: /root/.cache/modelscope/hub/models/Qwen/Qwen3.5-35B-A3B
        run: |
          ray stop --force
          bash tests/special_npu/run_qwen3_5_35b_grpo_megatron.sh
