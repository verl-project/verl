name: ascend documentation doctests

on:
  pull_request:
    paths:
      - .github/workflows/doctest_ascend.yml
      - tests/e2e/doctests/**
      - tests/special_sanity/test_doctest_helper.py
      - docs/ascend_tutorial/zh/get_start/**
      - scripts/install_*_mcore_npu.sh
      - requirements-npu.txt
      - docker/ascend/Dockerfile.ascend_9.2.1_a3*
      - docker/ascend/patches/**
      - .dockerignore
      - tests/special_npu/quick_start/**
  workflow_dispatch:
    inputs:
      backend:
        description: Backend to test (vLLM also checks Docker builds and published images)
        required: true
        default: all
        type: choice
        options:
          - all
          - fsdp2_vllm
          - megatron_vllm
          - fsdp2_sglang
          - megatron_sglang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      prebuilt: ${{ steps.matrix.outputs.prebuilt }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Test documentation tooling on CPU
        run: |
          uv venv --python 3.12
          uv pip install pytest
          .venv/bin/python -m pytest -q tests/special_sanity/test_doctest_helper.py
      - name: Read installation cases and images from the public guide
        id: matrix
        env:
          SELECTED_CASE: ${{ inputs.backend || 'all' }}
        run: |
          helper=tests/e2e/doctests/scripts/doctest_helper.py
          matrix=$(.venv/bin/python "$helper" matrix --case "$SELECTED_CASE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          prebuilt=$(.venv/bin/python "$helper" matrix --method prebuilt --case "$SELECTED_CASE")
          echo "prebuilt=$prebuilt" >> "$GITHUB_OUTPUT"
  docker-build:
    name: Dockerfile build (A3 vLLM, arm64)
    needs: check
    if: github.repository_owner == 'verl-project' && contains(needs.check.outputs.prebuilt, 'vllm')
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    env:
      ALLOW_INSTALL: "1"
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      # Match the existing Ascend image-build workflow's hosted-runner disk setup.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - name: Build the documented Dockerfile and inspect the resulting image
        shell: bash
        run: |
          set -euo pipefail
          bash tests/e2e/doctests/scripts/run_doctests.sh installation docker 2>&1 | tee "$RUNNER_TEMP/docker-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctest-docker-build-log
          path: ${{ runner.temp }}/docker-build.log
          if-no-files-found: warn
          retention-days: 7
  quickstart-image:
    name: Published image (${{ matrix.case }})
    needs: check
    if: github.repository_owner == 'verl-project' && contains(needs.check.outputs.prebuilt, 'vllm')
    runs-on: linux-aarch64-a3-800i-8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.check.outputs.prebuilt) }}
    timeout-minutes: 60
    container:
      image: ${{ matrix.image }}
      options: --shm-size 16g
    defaults:
      run:
        shell: bash -el {0}
    env: &npu_inputs
      NDEVICES_PER_NODE: "8"
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      # Shared inputs may be read-only. Datasets writes locks and Arrow files here.
      HF_DATASETS_CACHE: /tmp/verl-doctest/huggingface/datasets
      TRANSFORMERS_VERBOSITY: error
      MODEL_PATH: /root/.cache/modelscope/hub/models/Qwen/Qwen3-0.6B
      GSM8K_DATASET_PATH: /root/.cache/modelscope/dataset/openai/gsm8k
    steps:
      - uses: actions/checkout@v4
      - name: Run documented Quick Start in the published image
        env:
          QUICKSTART_CASE: ${{ matrix.case }}
          DOCTEST_REPO_ROOT: /verl
        run: |
          npu-smi info
          bash tests/e2e/doctests/scripts/run_doctests.sh quickstart "$QUICKSTART_CASE"
  installation:
    name: Installation (${{ matrix.case }})
    # Run after image Quick Start so this workflow allocates one NPU job at a time.
    needs: [check, quickstart-image]
    if: ${{ !cancelled() && needs.check.result == 'success' && github.repository_owner == 'verl-project' }}
    runs-on: linux-aarch64-a3-800i-8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    # Megatron source builds can exceed three hours on the A3 runner.
    timeout-minutes: 360
    container:
      image: ${{ matrix.image }}
      options: --shm-size 16g
    defaults:
      run:
        shell: bash -el {0}
    env: *npu_inputs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check cached inputs and writable dataset cache
        run: |
          if [[ ! -s "${MODEL_PATH}/config.json" ]]; then
            echo "::error::Model config missing or empty: ${MODEL_PATH}/config.json"
            exit 1
          fi
          if [[ ! -d "$GSM8K_DATASET_PATH" ]]; then
            echo "::error::GSM8K dataset directory not found: $GSM8K_DATASET_PATH"
            exit 1
          fi
          if ! mkdir -p "$HF_DATASETS_CACHE" ||
             ! cache_probe="$(mktemp "${HF_DATASETS_CACHE}/.write-test.XXXXXX")"; then
            echo "::error::Dataset processing cache is not writable: $HF_DATASETS_CACHE"
            exit 1
          fi
          rm -f "$cache_probe"
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: '26.9.4-1'
          channel-alias: https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          channels: conda-forge
          conda-remove-defaults: true
          show-channel-urls: true
          activate-environment: ""
          auto-activate: false
      - name: Install documented environment and run Quick Start
        env:
          ALLOW_INSTALL: "1"
          INSTALL_CASE: ${{ matrix.case }}
          PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
        run: |
          npu-smi info
          export INSTALL_BACKEND="${INSTALL_CASE##*_}"
          bash tests/e2e/doctests/scripts/run_doctests.sh installation source
