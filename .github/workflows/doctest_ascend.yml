name: ascend documentation doctests

on:
  pull_request:
    paths:
      - .github/workflows/doctest_ascend.yml
      - tests/e2e/doctests/**
      - tests/special_sanity/test_doctest_helper.py
      - docs/ascend_tutorial/zh/get_start/**
      - scripts/install_*_mcore_npu.sh
      - tests/special_npu/quick_start/**
  workflow_dispatch:
    inputs:
      backend:
        description: Combination to install from source and verify with one GRPO step
        required: true
        default: fsdp2_vllm
        type: choice
        options:
          - fsdp2_vllm
          - megatron_vllm
          - fsdp2_sglang
          - megatron_sglang

permissions:
  contents: read

env:
  INSTALL_CASE: ${{ inputs.backend || 'fsdp2_vllm' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
      - name: Test documentation tooling on CPU
        run: |
          uv venv --python 3.12
          uv pip install pytest
          .venv/bin/python -m pytest -q tests/special_sanity/test_doctest_helper.py
      - name: Read the A3 CANN base image from the backend Dockerfile
        id: image
        run: |
          case "$INSTALL_CASE" in
            fsdp2_vllm|megatron_vllm) dockerfile=docker/ascend/Dockerfile.ascend_9.1.0_a3 ;;
            fsdp2_sglang|megatron_sglang) dockerfile=docker/ascend/Dockerfile.ascend.sglang_8.5.0_a3 ;;
            *) exit 1 ;;
          esac
          image=$(awk '$1 == "FROM" {print $2; exit}' "$dockerfile")
          [[ "$image" == swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
  installation:
    needs: check
    # Fork PRs use the upstream repository's workflow-approval policy, as in e2e_ascend.yml.
    if: github.repository_owner == 'verl-project'
    runs-on: linux-aarch64-a3-800i-8
    timeout-minutes: 180
    container:
      image: ${{ needs.check.outputs.image }}
      options: --shm-size 16g
    defaults:
      run:
        shell: bash -el {0}
    env:
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      TRANSFORMERS_VERBOSITY: error
      MODEL_PATH: /root/.cache/modelscope/hub/models/Qwen/Qwen3-0.6B
      GSM8K_DATASET_PATH: /root/.cache/modelscope/dataset/openai/gsm8k
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check cached model and dataset paths
        run: |
          if [[ ! -s "${MODEL_PATH}/config.json" ]]; then
            echo "::error::Model config missing or empty: ${MODEL_PATH}/config.json"
            exit 1
          fi
          if [[ ! -d "$GSM8K_DATASET_PATH" ]]; then
            echo "::error::GSM8K dataset directory not found: $GSM8K_DATASET_PATH"
            exit 1
          fi
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: false
      - name: Install documented environment and run Quick Start
        env:
          ALLOW_INSTALL: "1"
          NDEVICES_PER_NODE: "8"
        run: |
          npu-smi info
          export INSTALL_BACKEND="${INSTALL_CASE##*_}"
          bash tests/e2e/doctests/scripts/run_doctests.sh installation source
