# GRPO on 2 Cloud TPU v6e-1 slices (the TPU counterpart of e2e_v1_separate_async.yml and
# e2e_v1_separate_async_ascend.yml).
#
# Runs the 5-step Qwen3-0.6B GSM8K GRPO smoke test of examples/tpu/grpo/README.md on 2 chips: V1 separate-async trainer,
# TorchTitan trainer on one v6e-1 slice, vLLM rollout on the other, tpu-sync weight sync with its parity checks on
# (VERIFY_PARITY=all). The log must show finite losses, gradients, a reward, validation, rollout and trainer log-probs
# that agree, and passed parity checks (tests/special_tpu/verify_tpu_e2e_log.py). See tpu_unit_tests.yml and
# tests/special_tpu/README.md for how the TPU jobs run, and where.

name: e2e_v1_separate_async_tpu

on:
  push:
    branches:
      - main
      - v0.*
    paths:
      - "**/*.py"
      # Other entrypoints
      - "!examples/**"
      - "!tests/**"
      - "!verl/trainer/main_*.py"
      - "!verl/trainer/fsdp_sft_trainer.py"
      # Not used on TPU
      - "!verl/models/mcore/**"
      - "!verl/workers/**/megatron_*.py"
      - "!verl/workers/engine/automodel/**"
      - "!verl/workers/engine/megatron/**"
      - "!verl/workers/engine/mindspeed/**"
      - "!verl/workers/engine/veomni/**"
      - "!verl/workers/rollout/sglang_rollout/**"
      - "!verl/workers/rollout/trtllm_rollout/**"
      # Entrypoints
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/config/**"
      - "examples/tpu/grpo/run_qwen3_torchtitan.sh"
      - "examples/tpu/grpo/Dockerfile"
      # Checks out the verl-hardware-plugin commit under test
      - "examples/tpu/grpo/README.md"
      - "tests/special_tpu/**"
      - "!tests/special_tpu/README.md"
      - ".github/workflows/e2e_v1_separate_async_tpu.yml"
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      - "**/*.py"
      # Other entrypoints
      - "!examples/**"
      - "!tests/**"
      - "!verl/trainer/main_*.py"
      - "!verl/trainer/fsdp_sft_trainer.py"
      # Not used on TPU
      - "!verl/models/mcore/**"
      - "!verl/workers/**/megatron_*.py"
      - "!verl/workers/engine/automodel/**"
      - "!verl/workers/engine/megatron/**"
      - "!verl/workers/engine/mindspeed/**"
      - "!verl/workers/engine/veomni/**"
      - "!verl/workers/rollout/sglang_rollout/**"
      - "!verl/workers/rollout/trtllm_rollout/**"
      # Entrypoints
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/config/**"
      - "examples/tpu/grpo/run_qwen3_torchtitan.sh"
      - "examples/tpu/grpo/Dockerfile"
      # Checks out the verl-hardware-plugin commit under test
      - "examples/tpu/grpo/README.md"
      - "tests/special_tpu/**"
      - "!tests/special_tpu/README.md"
      - ".github/workflows/e2e_v1_separate_async_tpu.yml"
  workflow_dispatch:
    inputs:
      plugin_repo:
        description: "verl-hardware-plugin repository, e.g. a fork (empty: the one examples/tpu/grpo/README.md clones)"
        required: false
        default: ""
        type: string
      plugin_commit:
        description: "verl-hardware-plugin full commit id, branch or tag (empty: the commit examples/tpu/grpo/README.md checks out)"
        required: false
        default: ""
        type: string

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
permissions:
  contents: read

env:
  # The self-hosted runners run as root.
  PIP_ROOT_USER_ACTION: ignore
  # Give up after waiting this long for TPU quota in the Kueue queue, and for the pods of the admitted RayCluster.
  QUEUE_TIMEOUT_MINS: "90"
  POD_READY_TIMEOUT_MINS: "60"
  # The image of examples/tpu/grpo/Dockerfile is only built (privileged, pushes to the registry) for code that is
  # already in this repository. Pull requests from forks wait for docker-build-tpu.yml instead.
  TPU_CI_ALLOW_IMAGE_BUILD: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  IMAGE_WAIT_MINS: "30"
  # Empty unless set by hand: the plugin repository and commit that examples/tpu/grpo/README.md checks out.
  VERL_HARDWARE_PLUGIN_REPO: ${{ inputs.plugin_repo }}
  VERL_HARDWARE_PLUGIN_COMMIT: ${{ inputs.plugin_commit }}

jobs:
  setup:
    name: Select the TPU CI runners
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.runner.outputs.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: tests/special_tpu/gke/tpu-ci.env
          sparse-checkout-cone-mode: false
      - name: Read TPU_CI_RUNNER (repository variable, else tests/special_tpu/gke/tpu-ci.env)
        id: runner
        env:
          TPU_CI_RUNNER: ${{ vars.TPU_CI_RUNNER }}
        run: |
          source tests/special_tpu/gke/tpu-ci.env
          echo "runner=${TPU_CI_RUNNER}" >> "${GITHUB_OUTPUT}"
          echo "TPU CI runner label: ${TPU_CI_RUNNER:-none, so the TPU jobs are skipped}"

  e2e_v1_separate_async_tpu:
    needs: setup
    if: needs.setup.outputs.runner != ''
    name: GSM8K GRPO Qwen3-0.6B on 2 x TPU v6e-1 (TorchTitan + vLLM, tpu-sync, V1 separate async)
    runs-on: ${{ needs.setup.outputs.runner }}
    timeout-minutes: 240 # Includes waiting for TPU quota (Kueue) and TPU hosts.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Running the GSM8K GRPO smoke test on 2 TPU v6e chips (examples/tpu/grpo/run_qwen3_torchtitan.sh, MODEL_SIZE=0.6B)
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh grpo
      - name: Clean up the RayCluster
        if: always()
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh teardown grpo
      - name: Upload the TPU job logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tpu-logs-grpo-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verl-tpu-ci-${{ github.run_id }}/*.log
          if-no-files-found: ignore
          retention-days: 14
