# # Tests layout

# Each folder under tests/ corresponds to a test category for a sub-namespace in verl. For instance:
# - `tests/trainer` for testing functionality related to `verl/trainer`
# - `tests/models` for testing functionality related to `verl/models`
# - ...

# There are a few folders with `special_` prefix, created for special purposes:
# - `special_distributed`: unit tests that must run with multiple GPUs
# - `special_e2e`: end-to-end tests with training/generation scripts
# - `special_npu`: tests for NPUs
# - `special_sanity`: a suite of quick sanity tests
# - `special_standalone`: a set of test that are designed to run in dedicated environments

# Accelerators for tests 
# - By default tests are run with GPU available, except for the ones under `special_npu`, and any test script whose name ends with `on_cpu.py`.
# - For test scripts with `on_cpu.py` name suffix would be tested on CPU resources in linux environment.

# # Workflow layout

# All CI tests are configured by yaml files in `.github/workflows/`. Here's an overview of all test configs:
# 1. A list of always triggered CPU sanity tests: `check-pr-title.yml`, `secrets_scan.yml`, `check-pr-title,yml`, `pre-commit.yml`, `doc.yml`
# 2. Some heavy multi-GPU unit tests, such as `model.yml`, `vllm.yml`, `sgl.yml`
# 3. End-to-end tests: `e2e_*.yml`
# 4. Unit tests
#   - `cpu_unit_tests.yml`, run pytest on all scripts with file name pattern `tests/**/test_*_on_cpu.py`
#   - `gpu_unit_tests.yml`, run pytest on all scripts with file without the `on_cpu.py` suffix.
#   - Since cpu/gpu unit tests by default runs all tests under `tests`, please make sure tests are manually excluded in them when
#     - new workflow yaml is added to `.github/workflows`
#     - new tests are added to workflow mentioned in 2.
# name: Check PR Title

name: reward_model_vllm_ascend

on:
  # Temporarily paused for the coverage-only run; uncomment these events to restore normal CI.
  # pull_request:
  #   branches:
  #     - main
  #     - v0.*
  #   paths:
  #     - "verl/**/*.py"
  #     # Entrypoints
  #     - ".github/workflows/reward_model_vllm_ascend.yml"
  #     - "tests/experimental/reward_loop/**"
  workflow_call:
    inputs:
      coverage_mode:
        description: Collect raw branch coverage for the existing workload steps
        type: boolean
        required: false
        default: false

concurrency:
  group: reward_model_vllm_ascend-${{ inputs.coverage_mode && 'coverage' || 'pr' }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.coverage_mode && github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
permissions:
  contents: read

env:
  VERL_COVERAGE_ENABLED: ${{ inputs.coverage_mode }}
  # Disposable cache; preprocessing rebuilds it when missing.
  HF_DATASETS_CACHE: /root/.cache/temp/hf-datasets

jobs:
  reward_model_vllm_ascend:
    if: github.repository_owner == 'verl-project'
    runs-on: linux-aarch64-a3-800i-8
    timeout-minutes: ${{ inputs.coverage_mode && 150 || 60 }} # Increase this timeout value as needed
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: >-
        --shm-size 16g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - name: Check npu and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Check initial pip list from image
        run: |
          pip list
      - name: Checkout verl-project/verl repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Install the current repository
        run: |
          pip install --no-deps -e .[test]
      - name: Check final pip list
        run: |
          pip list
      - name: Prepare weights
        run: |
          ln -s /root/.cache/modelscope/hub/models ~/models
      - name: Initialize coverage (optional)
        if: inputs.coverage_mode
        shell: bash
        env:
          VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/reward_model_vllm_ascend.yml/${{ github.job }}/data
          VERL_COVERAGE_WORKFLOW: reward_model_vllm_ascend.yml
          VERL_COVERAGE_JOB: ${{ github.job }}
        run: |
          # Persist identity for subsequent workload steps, but not instrumentation.
          printf 'VERL_COVERAGE_ROOT=%s\n' "$VERL_COVERAGE_ROOT" >> "$GITHUB_ENV"
          printf 'VERL_COVERAGE_WORKFLOW=%s\n' "$VERL_COVERAGE_WORKFLOW" >> "$GITHUB_ENV"
          printf 'VERL_COVERAGE_JOB=%s\n' "$VERL_COVERAGE_JOB" >> "$GITHUB_ENV"
          command -v uv >/dev/null || python -m pip install uv
          uv pip install --python "$(python -c 'import sys; print(sys.executable)')" "coverage==7.8.2" "PyYAML==6.0.2"
          python scripts/ci/coverage/collect.py init
      - name: Prepare gsm8k dataset
        run: |
          ray stop --force
          python3 examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/.cache/modelscope/dataset/openai/gsm8k --local_dir ${HOME}/data/gsm8k
        shell: python scripts/ci/coverage/collect.py run step-06 {0}
      - name: Print system memory before tests
        run: |
          awk '/^(MemTotal|MemFree|MemAvailable|Cached|Buffers|AnonPages|Shmem|Slab):/ {
              printf "%-16s %10.3f GiB\n", $1, $2/1048576
          }' /proc/meminfo
      - name: Running vllm generative reward model tests on 8 NPUs
        run: |
          ROLLOUT_NAME=vllm pytest -s -x tests/experimental/reward_loop/test_reward_model_genrm.py
        shell: python scripts/ci/coverage/collect.py run step-08 {0}
      - name: Running vllm discriminative reward model tests on 8 NPUs
        run: |
          ROLLOUT_NAME=vllm pytest -s -x tests/experimental/reward_loop/test_reward_model_disrm.py
        shell: python scripts/ci/coverage/collect.py run step-09 {0}
      - name: Running vllm agent loop with reward manager tests on 8 NPUs
        run: |
          ROLLOUT_NAME=vllm pytest -s -x tests/experimental/reward_loop/test_agent_reward_loop_standalone.py
        shell: python scripts/ci/coverage/collect.py run step-10 {0}
      - name: Running vllm agent loop with reward model colocate tests on 8 NPUs
        run: |
          export HCCL_HOST_SOCKET_PORT_RANGE=auto
          export HCCL_NPU_SOCKET_PORT_RANGE=auto
          ROLLOUT_NAME=vllm pytest -s -x tests/experimental/reward_loop/test_agent_reward_loop_colocate.py
        shell: python scripts/ci/coverage/collect.py run step-11 {0}
      - name: Package coverage (optional)
        if: ${{ always() && inputs.coverage_mode }}
        shell: bash
        env:
          VERL_COVERAGE_ROOT: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/reward_model_vllm_ascend.yml/${{ github.job }}/data
        run: python scripts/ci/coverage/collect.py package
      - name: Retain coverage (optional)
        if: ${{ always() && inputs.coverage_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: ascend-coverage-reward_model_vllm_ascend.yml-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.ci-coverage/${{ github.run_id }}-${{ github.run_attempt }}/reward_model_vllm_ascend.yml/${{ github.job }}/coverage.tar.gz
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14
